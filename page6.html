<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LXR | Stack</title>

    <script>
        if (sessionStorage.getItem('allow_access') === 'yes') {
            sessionStorage.removeItem('allow_access');
            document.documentElement.style.display = 'block';
        } else {
            var path = window.location.pathname;
            var pageName = path.split("/").pop();
            sessionStorage.setItem('last_visited_page', pageName);
            document.documentElement.style.display = 'none';
            window.location.replace('index.html');
        }
    </script>

    <style>
        html { display: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a; /* Dark concrete grey */
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            perspective: 1000px;
        }

        .instruction {
            position: absolute;
            bottom: 40px;
            color: #666;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
        }

        /* --- THE DECK CONTAINER --- */
        .card-stack {
            position: relative;
            width: 350px;
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- INDIVIDUAL CARD STYLES --- */
        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #f4f4f4;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            padding: 30px;
            box-sizing: border-box;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            
            /* Center content */
            justify-content: space-between;
            
            /* Prevent text selection */
            user-select: none;
        }

        .card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        /* --- CARD CONTENT --- */
        .card-header {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
        }

        .card-title {
            font-size: 3rem;
            font-weight: 900;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: -1px;
            word-wrap: break-word;
        }

        .card-footer {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }

        /* --- ANIMATION CLASSES (Added via JS) --- */
        
        /* Fly Right */
        .swiped-right {
            animation: flyRight 0.6s forwards ease-in;
            pointer-events: none; /* Can't click again */
        }
        
        /* Fly Left */
        .swiped-left {
            animation: flyLeft 0.6s forwards ease-in;
            pointer-events: none;
        }

        @keyframes flyRight {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(100vw, 200px) rotate(45deg); opacity: 0; }
        }

        @keyframes flyLeft {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-100vw, 200px) rotate(-45deg); opacity: 0; }
        }

        /* --- LAST CARD (REFRESH) --- */
        .card.refresh-card {
            background: #ccff00; /* Neon */
            color: #000;
            z-index: 0; /* Always at bottom */
        }

    </style>
</head>
<body>

    <div class="instruction">CLICK TO DISCARD</div>

    <div class="card-stack" id="stack">
        
        <div class="card refresh-card" style="z-index: 1;" onclick="location.reload()">
            <div class="card-header">SYSTEM</div>
            <div class="card-title">END OF<br>STACK</div>
            <div class="card-footer">
                <span>CLICK TO REFRESH</span>
                <span>↺</span>
            </div>
        </div>

        <div class="card" style="z-index: 2; transform: rotate(-2deg);">
            <div class="card-header">PROJECT 004</div>
            <div class="card-title">NEURAL<br>GARDEN</div>
            <div class="card-footer">
                <span>AI / WEBGL</span>
                <span>2024</span>
            </div>
        </div>

        <div class="card" style="z-index: 3; transform: rotate(3deg);">
            <div class="card-header">PROJECT 003</div>
            <div class="card-title">BRUTAL<br>FORMS</div>
            <div class="card-footer">
                <span>ARCHIVE</span>
                <span>2023</span>
            </div>
        </div>

        <div class="card" style="z-index: 4; transform: rotate(-1deg);">
            <div class="card-header">PROJECT 002</div>
            <div class="card-title">SONIC<br>YOUTH</div>
            <div class="card-footer">
                <span>AUDIO</span>
                <span>2022</span>
            </div>
        </div>

        <div class="card" style="z-index: 5; transform: rotate(1deg);">
            <div class="card-header">PROJECT 001</div>
            <div class="card-title">HEAVY<br>METAL</div>
            <div class="card-footer">
                <span>IDENTITY</span>
                <span>2021</span>
            </div>
        </div>

    </div>

    <script>
        const cards = document.querySelectorAll('.card');

        // Add click event to all cards EXCEPT the last one (refresh card)
        cards.forEach(card => {
            if (!card.classList.contains('refresh-card')) {
                card.addEventListener('click', function() {
                    swipeCard(this);
                });
            }
        });

        function swipeCard(card) {
            // 50/50 chance to fly left or right
            const randomDir = Math.random() > 0.5 ? 'swiped-right' : 'swiped-left';
            card.classList.add(randomDir);
        }
    </script>
</body>
</html>
