<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LXR | Cinema</title>
    <script>
        if (sessionStorage.getItem('allow_access') === 'yes') {
            sessionStorage.removeItem('allow_access');
            document.documentElement.style.display = 'block';
        } else {
            sessionStorage.setItem('last_visited_page', window.location.pathname.split("/").pop());
            document.documentElement.style.display = 'none';
            window.location.replace('index.html');
        }
    </script>
    <style>
        html { display: none; }
        body { background: #000; margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        
        .screen-container {
            width: 80%;
            max-width: 800px;
            aspect-ratio: 16/9;
            background: #111;
            box-shadow: 0 0 100px rgba(255, 255, 255, 0.1);
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Pixel style filter */
            image-rendering: pixelated; 
            filter: contrast(1.2) brightness(0.8);
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0) 90%, rgba(255,255,255,0.1) 95%, rgba(0,0,0,0));
            background-size: 100% 3px;
            animation: flicker 0.1s infinite;
            opacity: 0.1;
        }

        @keyframes flicker { 0% { opacity: 0.05; } 100% { opacity: 0.1; } }

        .controls {
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .controls:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="screen-container">
        <video id="vid" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4" loop muted autoplay></video>
        <div class="overlay"></div>
    </div>
    
    <div class="controls" onclick="toggleAudio()">
        [ CLICK TO UNMUTE / MUTE ]
    </div>

    <script>
        const vid = document.getElementById('vid');
        function toggleAudio() {
            vid.muted = !vid.muted;
        }
    </script>
</body>
</html>
