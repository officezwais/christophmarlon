<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LXR | NO SIGNAL</title>
    <script>
        if (sessionStorage.getItem('allow_access') === 'yes') {
            sessionStorage.removeItem('allow_access');
            document.documentElement.style.display = 'block';
        } else {
            var path = window.location.pathname;
            var pageName = path.split("/").pop();
            sessionStorage.setItem('last_visited_page', pageName);
            document.documentElement.style.display = 'none';
            window.location.replace('index.html');
        }
    </script>
    <style>
        html { display: none; }
        body { margin: 0; padding: 0; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }

        .noise {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-radial-gradient(#000 0 0.0001%, #111 0 0.0002%) 50% 0/2500px 2500px,
                        repeating-conic-gradient(#000 0 0.0001%, #111 0 0.0002%) 60% 60%/2500px 2500px;
            background-blend-mode: difference;
            animation: shift 0.2s infinite alternate;
            opacity: 0.5;
        }

        .message {
            position: relative; z-index: 10;
            color: #fff; font-family: monospace; font-size: 2rem;
            text-align: center;
            mix-blend-mode: exclusion;
        }

        .glitch-text {
            animation: glitch 1s infinite;
            font-weight: bold;
        }

        @keyframes shift { 100% { background-position: 50% 0, 60% 50%; } }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body>
    <div class="noise"></div>
    <div class="message">
        <div class="glitch-text">FATAL_EXCEPTION</div>
        <div style="font-size: 1rem; margin-top: 20px;">MEMORY_LEAK_DETECTED</div>
        <br>
        <button onclick="location.reload()" style="background: white; border: none; padding: 10px 20px; font-family: monospace; cursor: pointer; font-weight: bold;">FORCE_RELOAD</button>
    </div>
</body>
</html>
