<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Router</title>
    <style>
        :root {
            --apple-blue: #007AFF;
            --apple-bg: #F2F2F7;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.4);
            --text-primary: #1D1D1F;
            --text-secondary: #86868B;
        }

        body {
            background-color: var(--apple-bg);
            /* Subtle abstract gradient background */
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-size: cover;
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0;
        }

        /* The Glass Card */
        .modal {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            width: 320px;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            display: none; /* Hidden by default until JS checks logic */
            animation: popIn 0.4s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        /* Icon styling */
        .icon-container {
            margin-bottom: 20px;
        }
        
        .icon-container svg {
            width: 60px;
            height: 60px;
            color: #FF3B30; /* Apple System Red */
            filter: drop-shadow(0 4px 6px rgba(255, 59, 48, 0.3));
        }

        /* Typography */
        h1 {
            font-size: 20px;
            font-weight: 600;
            margin: 0 0 10px 0;
            color: var(--text-primary);
        }

        p {
            font-size: 15px;
            line-height: 1.4;
            color: var(--text-secondary);
            margin: 0 0 25px 0;
        }

        /* The Button */
        .btn {
            background-color: var(--apple-blue);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        .btn:hover {
            background-color: #0062cc;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Animation */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body>
    <script>
        // --- 1. THE LIST OF 10 PAGES (Strictly 10) ---
        const allPages = [ 
            'page2.html', 
            'page3.html', 
            'page6.html', 
            'page9.html', 
            'page15.html', 
        ];

        function launchRandomPage() {
            // A. Create Ticket
            sessionStorage.setItem('allow_access', 'yes');

            // B. Filter out the last visited page to ensure variety
            const lastPage = sessionStorage.getItem('last_visited_page');
            const available = allPages.filter(p => p !== lastPage);

            // C. Pick Random
            // If only 1 page remains and it was the last visited, we might have an empty array.
            // In that edge case, just reset to allPages.
            const sourceArray = available.length > 0 ? available : allPages;
            
            const randomPage = sourceArray[Math.floor(Math.random() * sourceArray.length)];

            // D. Save current as last visited for next time
            sessionStorage.setItem('last_visited_page', randomPage);

            // E. Go
            window.location.replace(randomPage);
        }

        // 2. CHECK HISTORY
        // If they haven't visited before, show the "Apple" dialog.
        // If they have, route them immediately.
        if (!sessionStorage.getItem('visited_before')) {
            document.getElementById('system-dialog').style.display = 'block';
            sessionStorage.setItem('visited_before', 'true');
        } else {
            launchRandomPage();
        }
    </script>
</body>
</html>
