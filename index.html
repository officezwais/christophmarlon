<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SYSTEM ROUTER | 10 PAGES</title>
    <style>
        body { background-color: #0000aa; color: #fff; font-family: monospace; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; margin: 0; }
        .popup { background: #c0c0c0; border: 2px solid #fff; border-right-color: #404040; border-bottom-color: #404040; width: 400px; color: black; font-family: Arial, sans-serif; display: none; padding: 2px; }
        .header { background: #000080; color: white; padding: 4px 8px; font-weight: bold; display: flex; justify-content: space-between; }
        .content { padding: 20px; display: flex; gap: 15px; }
        .btn { margin-top: 10px; border: 2px solid #404040; border-left-color: #fff; border-top-color: #fff; background: #c0c0c0; padding: 5px 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="popup" id="crash-popup">
        <div class="header"><span>System Error</span><span>X</span></div>
        <div class="content">
            <div style="font-size:30px; color:red; border:2px solid red; border-radius:50%; width:40px; height:40px; display:flex; align-items:center; justify-content:center;">X</div>
            <div>
                <p><strong>System Halted.</strong></p>
                <p style="font-size: 12px;">10-Page Array Unstable.<br>Manual reboot required.</p>
                <button class="btn" onclick="launchRandomPage()">REBOOT</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. THE LIST OF 10 PAGES ---
        const allPages = [
            'page1.html', 'page2.html', 'page3.html', 'page4.html', 'page5.html',
            'page6.html', 'page7.html', 'page8.html', 'page9.html', 'page10.html',
            'page_cinema.html',  // The Movie
    'page_critic.html',  // The Judge
    'page_audio.html'    // The Music
        ];

        function launchRandomPage() {
            // A. Create Ticket
            sessionStorage.setItem('allow_access', 'yes');

            // B. Filter out the last visited page so you don't repeat
            const lastPage = sessionStorage.getItem('last_visited_page');
            const available = allPages.filter(p => p !== lastPage);

            // C. Pick Random
            const randomPage = available[Math.floor(Math.random() * available.length)];

            // D. Go
            window.location.replace(randomPage);
        }

        // 2. CHECK HISTORY
        if (!sessionStorage.getItem('visited_before')) {
            document.getElementById('crash-popup').style.display = 'block';
            sessionStorage.setItem('visited_before', 'true');
        } else {
            launchRandomPage();
        }
    </script>
</body>
</html>
