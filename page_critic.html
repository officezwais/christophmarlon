<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LXR | Critique</title>
    <script>
        if (sessionStorage.getItem('allow_access') === 'yes') {
            sessionStorage.removeItem('allow_access');
            document.documentElement.style.display = 'block';
        } else {
            sessionStorage.setItem('last_visited_page', window.location.pathname.split("/").pop());
            document.documentElement.style.display = 'none';
            window.location.replace('index.html');
        }
    </script>
    <style>
        html { display: none; }
        body { background: #f4f4f4; margin: 0; height: 100vh; font-family: 'Helvetica Neue', sans-serif; overflow: hidden; }
        
        #draw-area {
            background: #fff;
            width: 500px;
            height: 500px;
            border: 2px solid #000;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            cursor: crosshair;
        }
        
        .ui { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); text-align: center; }
        
        button {
            background: #000; color: #fff; border: none; padding: 15px 30px; font-weight: bold; font-size: 1.2rem; cursor: pointer; text-transform: uppercase;
        }
        button:hover { background: #333; }

        .verdict-overlay {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center; justify-content: center; flex-direction: column;
            color: #fff;
            z-index: 100;
        }
        
        .verdict-text { font-size: 5rem; font-weight: 900; color: #ff0000; text-transform: uppercase; border: 10px solid #ff0000; padding: 20px; transform: rotate(-5deg); }
    </style>
</head>
<body>

    <div style="text-align:center; padding-top: 50px; text-transform:uppercase; font-weight:bold;">
        Create something.<br>I will judge you.
    </div>

    <canvas id="draw-area"></canvas>

    <div class="ui">
        <button onclick="judgeMe()">Submit for Review</button>
    </div>

    <div class="verdict-overlay" id="overlay">
        <div class="verdict-text" id="verdict">DERIVATIVE</div>
        <div style="margin-top: 30px; cursor: pointer;" onclick="location.reload()">TRY AGAIN</div>
    </div>

    <script>
        const canvas = document.getElementById('draw-area');
        const ctx = canvas.getContext('2d');
        canvas.width = 500; canvas.height = 500;
        
        let painting = false;
        
        function startPosition(e) { painting = true; draw(e); }
        function finishedPosition() { painting = false; ctx.beginPath(); }
        function draw(e) {
            if (!painting) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
        }
        
        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', finishedPosition);
        canvas.addEventListener('mousemove', draw);

        function judgeMe() {
            const critiques = [
                "DERIVATIVE", "LACKS SOUL", "BANAL", "TOO SAFE", 
                "PRETENTIOUS", "BORING", "UNDEVELOPED", "TRY HARDER"
            ];
            const randomCritique = critiques[Math.floor(Math.random() * critiques.length)];
            
            document.getElementById('verdict').innerText = randomCritique;
            document.getElementById('overlay').style.display = 'flex';
        }
    </script>
</body>
</html>
