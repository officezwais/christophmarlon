<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LXR | Sonic</title>
    <script>
        if (sessionStorage.getItem('allow_access') === 'yes') {
            sessionStorage.removeItem('allow_access');
            document.documentElement.style.display = 'block';
        } else {
            sessionStorage.setItem('last_visited_page', window.location.pathname.split("/").pop());
            document.documentElement.style.display = 'none';
            window.location.replace('index.html');
        }
    </script>
    <style>
        html { display: none; }
        body { background: #111; color: #fff; margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: monospace; }
        
        .visualizer {
            display: flex; gap: 5px; height: 100px; align-items: center;
        }
        .bar {
            width: 10px; background: #fff; animation: bounce 1s infinite ease-in-out;
        }
        
        @keyframes bounce { 
            0%, 100% { height: 10px; } 
            50% { height: 100px; } 
        }

        /* Stagger animations */
        .bar:nth-child(1) { animation-duration: 0.8s; }
        .bar:nth-child(2) { animation-duration: 1.2s; }
        .bar:nth-child(3) { animation-duration: 0.5s; }
        .bar:nth-child(4) { animation-duration: 1.0s; }
        .bar:nth-child(5) { animation-duration: 0.7s; }

        .play-btn {
            position: absolute; bottom: 50px; border: 1px solid #fff; padding: 10px 20px; cursor: pointer;
        }
    </style>
</head>
<body>
    
    <audio id="audio" src="track.mp3" loop></audio>

    <div class="visualizer">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div>
    </div>

    <div class="play-btn" onclick="document.getElementById('audio').play()">INITIALIZE AUDIO</div>
</body>
</html>
