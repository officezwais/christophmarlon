<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LXR | 11. VIVARIUM</title>

    <script>
        if (sessionStorage.getItem('allow_access') === 'yes') {
            sessionStorage.removeItem('allow_access');
            document.documentElement.style.display = 'block';
        } else {
            var path = window.location.pathname;
            var pageName = path.split("/").pop();
            sessionStorage.setItem('last_visited_page', pageName);
            document.documentElement.style.display = 'none';
            window.location.replace('index.html');
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        html { display: none; }

        body {
            margin: 0;
            padding: 20px;
            /* Textured paper background */
            background-color: #f7f5f0; 
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%239C92AC' fill-opacity='0.05' fill-rule='evenodd'/%3E%3C/svg%3E");
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            color: #000;
        }

        /* --- CORNER LABELS --- */
        .corner-text {
            position: absolute;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .tl { top: 40px; left: 40px; }
        .tr { top: 40px; right: 40px; }
        .bl { bottom: 40px; left: 40px; }
        .br { bottom: 40px; right: 40px; }

        /* --- FOLDER CONTAINER --- */
        .folder-wrapper {
            position: relative;
            width: 90%;
            max-width: 800px;
            aspect-ratio: 1.4 / 1;
            margin-top: 20px;
        }

        /* The Paper sticking out (Red Grid) */
        .folder-contents {
            position: absolute;
            top: -15px;
            left: 10px;
            right: 10px;
            height: 50px;
            background-color: #fff;
            /* Creating the red grid pattern */
            background-image: 
                linear-gradient(#ffb3b3 1px, transparent 1px), 
                linear-gradient(90deg, #ffb3b3 1px, transparent 1px);
            background-size: 15px 15px;
            z-index: 1;
            border-radius: 5px 5px 0 0;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
        }

        /* Add some random text to the grid paper */
        .folder-contents::before {
            content: "LAGETYP NORMAL 5.62";
            font-family: 'Courier New', monospace;
            font-size: 0.6rem;
            position: absolute;
            top: 5px;
            right: 150px;
            color: #333;
        }

        /* The Manila Folder Front */
        .folder-front {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fcebc5; /* Manila folder beige */
            z-index: 2;
            border-radius: 4px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1), 0 5px 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* Tab Cutout Effect using clip-path or gradient */
            /* Using a simpler visual trick for the tab: */
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        /* The Tab shape */
        .folder-front::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 0;
            width: 200px; /* Tab width */
            height: 15px;
            background-color: #fcebc5;
            border-radius: 8px 8px 0 0;
            z-index: 3;
        }

        /* --- TYPOGRAPHY ON FOLDER --- */
        .script-text {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 400;
            margin-bottom: -20px; /* Overlap effect */
            z-index: 2;
            color: #111;
        }

        .bold-text {
            font-family: 'Inter', sans-serif;
            font-size: clamp(3rem, 10vw, 7rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -2px;
            margin: 0;
            line-height: 1;
            z-index: 1;
            color: #000;
        }

        .subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 20px;
            letter-spacing: 1px;
        }

        /* --- POLAROID & CLIP --- */
        .polaroid-wrapper {
            position: absolute;
            top: -30px;
            right: 40px;
            z-index: 10;
            transform: rotate(3deg);
            transition: transform 0.3s ease;
        }

        .polaroid-wrapper:hover {
            transform: rotate(0deg) scale(1.05);
        }

        .photo-frame {
            background: #fff;
            padding: 10px 10px 30px 10px; /* Extra bottom padding for polaroid look */
            box-shadow: 2px 5px 15px rgba(0,0,0,0.2);
            width: 150px;
            height: auto;
        }

        .photo-frame img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            filter: grayscale(100%);
            display: block;
        }

        /* CSS Paperclip */
        .paperclip {
            position: absolute;
            top: -15px;
            right: 20px;
            width: 15px;
            height: 45px;
            border: 2px solid #888;
            border-radius: 10px;
            z-index: 11;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        /* Inner loop of paperclip */
        .paperclip::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 3px;
            width: 5px;
            height: 25px;
            border: 2px solid #888;
            border-radius: 5px;
            border-top: none; /* Open top loop */
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .polaroid-wrapper { width: 100px; right: 10px; top: -20px; }
            .photo-frame { width: 100px; padding: 5px 5px 20px 5px; }
            .corner-text { display: none; } /* Hide corners on small screens */
            .folder-wrapper { width: 100%; }
        }

    </style>
</head>
<body>

    <div class="corner-text tl">Art Projects</div>
    <div class="corner-text tr">2027-2030</div>
    <div class="corner-text bl">@lxr_system</div>
    <div class="corner-text br">lxr.system.com</div>

    <div class="folder-wrapper">
        <div class="folder-contents"></div>

        <div class="polaroid-wrapper">
            <div class="paperclip"></div>
            <div class="photo-frame">
                <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?ixlib=rb-1.2.1&auto=format&fit=crop&w=400&q=80" alt="Portrait">
            </div>
        </div>

        <div class="folder-front">
            <div class="script-text">Creative</div>
            <div class="bold-text">Portfolio</div>
            <div class="subtitle">LXR System</div>
        </div>
    </div>

    <div id="lxr-nav-trigger" style="position: fixed; top: 20px; right: 20px; z-index: 99999; cursor: pointer; mix-blend-mode: difference; color: black; font-family: 'Helvetica Neue', sans-serif; font-weight: bold; border: 1px solid black; padding: 5px 10px; background: transparent; text-transform: uppercase; font-size: 12px;">
        [ + ] INDEX
    </div>

    <div id="lxr-nav-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 99998; flex-direction: column; padding: 40px; box-sizing: border-box; font-family: 'Courier New', monospace; color: #fff; overflow-y: auto;">
        <div style="border-bottom: 1px solid #333; padding-bottom: 20px; margin-bottom: 20px; display: flex; justify-content: space-between;">
            <span>LXR_SYSTEM_DIRECTORY</span>
            <span onclick="document.getElementById('lxr-nav-overlay').style.display='none'" style="cursor: pointer;">[ CLOSE X ]</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px;">
            <a href="index.html" style="color: #fff; text-decoration: none; display: block; padding: 10px; border: 1px solid #fff;">&lt; RETURN TO HOME</a>
        </div>
    </div>

    <script>
        document.getElementById('lxr-nav-trigger').addEventListener('click', function() {
            document.getElementById('lxr-nav-overlay').style.display = 'flex';
        });
    </script>

</body>
</html>
